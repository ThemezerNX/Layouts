# Checks every layout, adds missing UUIDs, formats the repository and tells the Themezer API to import the new commit.

name: Deploy
on:
    push:
        branches:
            - master

jobs:
    updateLayouts:
        runs-on: ubuntu-latest
        if: github.repository_owner == 'ThemezerNX'
        steps:
            - name: Checkout Project
              uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Verify all layouts
              run: bun run test

            - name: Format
              run: bun fmt

            - name: Push changes
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  if [[ `git status --porcelain --untracked-files=no` ]]; then
                    git commit -am "Format & Automated UUID generation"
                    git push
                  fi

            - name: Get new SHA after push
              id: newsha
              run: |
                  # Only get SHA if something was committed
                  if [[ `git status --porcelain --untracked-files=no` ]]; then
                    git commit -am "Format & Automated UUID generation"
                    git push
                  fi
                  echo "NEW_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

            - name: Deploy
              uses: fjogeleit/http-request-action@v1
              with:
                  url: 'https://api.themezer.net/switch/layouts/run-update'
                  method: 'POST'
                  bearerToken: ${{ secrets.THEMEZER_BEARER_TOKEN }}
                  timeout: 60000
                  customHeaders: '{"Content-Type": "application/json"}'
                  data: '{"sha": "${{ env.NEW_SHA }}", "branch": "${{ github.ref }}"}'
